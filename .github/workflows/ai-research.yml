name: AI Lab research

# Monthly AI research for the experimental AI Lab tab (super admin only). Researches the public tickers that were
# requested in the app; sees no portfolio, holding, amount or account. Stored work is reused, so a run only pays for
# what changed, and spend has no cap unless AI_RESEARCH_MONTHLY_CAP_USD is set.
#
# Settings (repository or `prod` environment variables, all optional):
#   AI_LAB_ENABLED=false            turns the job off without a redeploy
#   AI_RESEARCH_PROVIDER            openai (default) or anthropic
#   AI_RESEARCH_MODEL_READ / _RANK  model names for reading and for the final ranking
#   AI_RESEARCH_MONTHLY_CAP_USD     optional monthly cap in USD (unset = no cap)
# Secrets (`prod` environment): OPENAI_API_KEY (ANTHROPIC_API_KEY only when switching to Claude),
# CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN.
on:
  schedule:
    # Saturdays 04:00 UTC; the first step runs the job only on the first Saturday of the month (day 1-7).
    - cron: '0 4 * * 6'
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated tickers (blank = every ticker with a pending request)'
        required: false
        default: ''
      force:
        description: 'Rewrite reports even when nothing changed'
        type: boolean
        default: false

concurrency:
  group: ai-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_LAB_ENABLED: ${{ vars.AI_LAB_ENABLED }}
      AI_RESEARCH_PROVIDER: ${{ vars.AI_RESEARCH_PROVIDER }}
      AI_RESEARCH_MODEL_READ: ${{ vars.AI_RESEARCH_MODEL_READ }}
      AI_RESEARCH_MODEL_RANK: ${{ vars.AI_RESEARCH_MODEL_RANK }}
      AI_RESEARCH_MONTHLY_CAP_USD: ${{ vars.AI_RESEARCH_MONTHLY_CAP_USD }}
      TICKERS: ${{ inputs.tickers }}
    steps:
      - name: Only the first Saturday of the month on schedule
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%d)" -gt 7 ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not the first Saturday of the month: nothing to do."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.gate.outputs.run == 'true'
      - name: Choose tickers
        id: pick
        if: steps.gate.outputs.run == 'true'
        # The dispatch input is untrusted text: validate it, never interpolate it into a script.
        run: |
          if [ -n "$TICKERS" ]; then
            if ! printf '%s' "$TICKERS" | grep -Eq '^[A-Za-z0-9]{2,12}(,[A-Za-z0-9]{2,12})*$'; then
              echo "::error::tickers must be comma-separated PSX symbols."; exit 1
            fi
            list=$(printf '%s' "$TICKERS" | tr 'a-z' 'A-Z')
            monthly=""
          else
            if [ "${{ github.event_name }}" = "schedule" ]; then monthly="--monthly"; else monthly=""; fi
            list=$(node scripts/ai-research.mjs --list $monthly)
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
          echo "monthly=$monthly" >> "$GITHUB_OUTPUT"
          echo "Tickers: ${list:-none}"
      - name: Refresh PSX company data and price history
        if: steps.gate.outputs.run == 'true' && steps.pick.outputs.list != ''
        env:
          LIST: ${{ steps.pick.outputs.list }}
        run: |
          node scripts/psx-facts-scrape.mjs "--tickers=$LIST" || true
          node scripts/psx-history-scrape.mjs "--tickers=$LIST" || true
      - name: Research
        if: steps.gate.outputs.run == 'true' && steps.pick.outputs.list != ''
        env:
          LIST: ${{ steps.pick.outputs.list }}
          FORCE_FLAG: ${{ inputs.force && '--force' || '' }}
        run: node scripts/ai-research.mjs "--tickers=$LIST" $FORCE_FLAG
      - name: Open or update a failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scraper failing: $GITHUB_WORKFLOW"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "AI Lab research run failed: $RUN_URL"
          fi
