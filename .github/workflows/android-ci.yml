name: Android CI

# Lint, unit tests and a debug build of the native Android app in android/. It also reads the shared TypeScript test
# vector (tests/fixtures/vault-vector.json) and, later, the bundled lib/ engine, so changes there run it too.
on:
  pull_request:
    paths: ['android/**', 'lib/**', 'mobile/src/data/**', 'tests/android-engine.test.mjs', 'tests/fixtures/vault-vector.json', '.github/workflows/android-*.yml']
  push:
    branches: [main]
    paths: ['android/**', 'lib/**', 'mobile/src/data/**', 'tests/android-engine.test.mjs', 'tests/fixtures/vault-vector.json', '.github/workflows/android-*.yml']
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: android-ci / build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Engine parity (shared TypeScript the phone runs)
        working-directory: .
        run: node --test tests/android-engine.test.mjs
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Firebase config (a placeholder, so the push build path is compiled; real ones are used only in releases)
        run: |
          cat > app/google-services.json <<'JSON'
          {"project_info":{"project_number":"1","project_id":"sipwise-ci","storage_bucket":"sipwise-ci.appspot.com"},
           "client":[
            {"client_info":{"mobilesdk_app_id":"1:1:android:0000000000000001","android_client_info":{"package_name":"com.uzairbukhari.sipwise"}},"api_key":[{"current_key":"ci-placeholder-key"}]},
            {"client_info":{"mobilesdk_app_id":"1:1:android:0000000000000002","android_client_info":{"package_name":"com.uzairbukhari.sipwise.staging"}},"api_key":[{"current_key":"ci-placeholder-key"}]}],
           "configuration_version":"1"}
          JSON
      - name: Style and static analysis
        run: ./gradlew ktlintCheck detekt --continue
      - name: Android Lint (warnings are errors)
        run: ./gradlew :app:lintStagingDebug :core:designsystem:lintDebug :core:engine:lintDebug --continue
      - name: Show lint findings
        if: failure()
        run: |
          for f in $(find . -name 'lint-results-*.txt' -path '*intermediates*'); do echo "=== $f"; grep -E "^.*(Error|Warning):" "$f" | sed 's#.*/android/##' | head -60; done
      - name: Unit tests (vault parity, palette contrast, version codes)
        run: ./gradlew :core:model:test :core:vault:test :core:network:test :core:session:test :core:designsystem:testDebugUnitTest :app:testStagingDebugUnitTest
      - name: Debug build
        run: ./gradlew :app:assembleStagingDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-reports
          path: |
            android/**/build/reports/**
            android/**/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: sipwise-staging-debug-apk
          path: android/app/build/outputs/apk/staging/debug/*.apk
          retention-days: 7
