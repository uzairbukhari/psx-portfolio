name: Android CI

# Lint, unit tests and a debug build of the native Android app in android/. It also reads the shared TypeScript test
# vector (tests/fixtures/vault-vector.json) and, later, the bundled lib/ engine, so changes there run it too.
on:
  pull_request:
    paths: ['android/**', 'lib/**', 'tests/fixtures/vault-vector.json', '.github/workflows/android-*.yml']
  push:
    branches: [main]
    paths: ['android/**', 'lib/**', 'tests/fixtures/vault-vector.json', '.github/workflows/android-*.yml']
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: android-ci / build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Style and static analysis
        run: ./gradlew ktlintCheck detekt --continue
      - name: Android Lint (warnings are errors)
        run: ./gradlew :app:lintStagingDebug :core:designsystem:lintDebug --continue
      - name: Show lint findings
        if: failure()
        run: |
          for f in $(find . -name 'lint-results-*.txt' -path '*intermediates*'); do echo "=== $f"; grep -E "^.*(Error|Warning):" "$f" | sed 's#.*/android/##' | head -60; done
      - name: Unit tests (vault parity, palette contrast, version codes)
        run: ./gradlew :core:model:test :core:vault:test :core:designsystem:testDebugUnitTest :app:testStagingDebugUnitTest
      - name: Debug build
        run: ./gradlew :app:assembleStagingDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/**/build/reports/**
            android/**/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: sipwise-staging-debug-apk
          path: android/app/build/outputs/apk/staging/debug/*.apk
          retention-days: 7
