name: Android promote

# Turns a pre-release into the full "latest" release. The in-app updater only offers the latest full release to the
# production app, so this is the gate between "built" and "reaches your phone". It runs in the `android-production`
# environment, which requires your approval (Settings > Environments).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to promote, e.g. android-v1.4.0'
        required: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: android-production
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the release
        run: |
          [[ "${{ inputs.tag }}" =~ ^android-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Only final versions (no -rc) can be promoted."; exit 1; }
          gh release view "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | tee assets.txt
          grep -q '^sipwise-.*\.apk$' assets.txt || { echo "::error::The release has no production APK."; exit 1; }
      - name: Make it the latest release
        run: gh release edit "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
