name: Android release

# Builds signed release artifacts from a tagged commit and publishes a GitHub pre-release. Runs when a tag
# `android-vMAJOR.MINOR.PATCH[-rc.N]` is pushed by hand, or is called by "Android cut release" (a tag created with
# GITHUB_TOKEN does not trigger other workflows, so the cut workflow calls this one directly).
# Signing material comes only from the `android-release` environment's secrets (see docs/android-release.md).
on:
  push:
    tags: ['android-v*']
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build, e.g. android-v1.4.0'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: android-release
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the tag
        id: v
        run: |
          if ! [[ "$TAG" =~ ^android-v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.([0-9]+))?$ ]]; then
            echo "::error::Tag '$TAG' is not android-vMAJOR.MINOR.PATCH or android-vMAJOR.MINOR.PATCH-rc.N"; exit 1
          fi
          name="${BASH_REMATCH[1]}"
          rc="${BASH_REMATCH[3]:-0}"
          [ "$rc" != 0 ] && name="$name-rc.$rc"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "prerelease_only=$([ "$rc" != 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - name: The tag must be on main or a release branch
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          if ! git branch -r --contains "$GITHUB_SHA" | grep -qE 'origin/(main|release/.+)$'; then
            echo "::error::$TAG is not on main or a release/* branch."; exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Decode signing keys
        env:
          PROD_B64: ${{ secrets.ANDROID_KEYSTORE_PROD_B64 }}
          STAGING_B64: ${{ secrets.ANDROID_KEYSTORE_STAGING_B64 }}
        run: |
          for v in PROD_B64 STAGING_B64; do
            [ -n "${!v}" ] || { echo "::error::Secret for $v is not set in the android-release environment (docs/android-release.md)."; exit 1; }
          done
          umask 077
          echo "$PROD_B64" | base64 -d > "$RUNNER_TEMP/prod.jks"
          echo "$STAGING_B64" | base64 -d > "$RUNNER_TEMP/staging.jks"
      - name: Firebase config (push notifications)
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_B64" ]; then
            echo "::warning::ANDROID_GOOGLE_SERVICES_JSON_B64 is not set: this build will have push notifications switched off."
          else
            umask 077
            echo "$GOOGLE_SERVICES_B64" | base64 -d > android/app/google-services.json
          fi
      - name: Check the signing certificates are the pinned ones
        env:
          PROD_PASS: ${{ secrets.ANDROID_KEYSTORE_PROD_PASSWORD }}
          STAGING_PASS: ${{ secrets.ANDROID_KEYSTORE_STAGING_PASSWORD }}
          PROD_SHA1: ${{ secrets.ANDROID_CERT_SHA1_PROD }}
          STAGING_SHA1: ${{ secrets.ANDROID_CERT_SHA1_STAGING }}
        run: |
          check() { # file pass expected-sha1 label
            actual=$(keytool -list -v -keystore "$1" -storepass "$2" 2>/dev/null | awk -F': ' '/SHA1:/{print $2; exit}' | tr -d ':' | tr 'A-F' 'a-f')
            want=$(echo "$3" | tr -d ':' | tr 'A-F' 'a-f')
            if [ -z "$want" ] || [ "$actual" != "$want" ]; then
              echo "::error::$4 keystore certificate ($actual) does not match the pinned SHA-1. Installing over the existing app would fail."; exit 1
            fi
          }
          check "$RUNNER_TEMP/prod.jks" "$PROD_PASS" "$PROD_SHA1" production
          check "$RUNNER_TEMP/staging.jks" "$STAGING_PASS" "$STAGING_SHA1" staging
      - name: Build, test, sign
        env:
          SIPWISE_PRODUCTION_KEYSTORE_FILE: ${{ runner.temp }}/prod.jks
          SIPWISE_PRODUCTION_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PROD_PASSWORD }}
          SIPWISE_PRODUCTION_KEY_ALIAS: ${{ secrets.ANDROID_KEY_PROD_ALIAS }}
          SIPWISE_PRODUCTION_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PROD_PASSWORD }}
          SIPWISE_STAGING_KEYSTORE_FILE: ${{ runner.temp }}/staging.jks
          SIPWISE_STAGING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STAGING_PASSWORD }}
          SIPWISE_STAGING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_STAGING_ALIAS }}
          SIPWISE_STAGING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_STAGING_PASSWORD }}
        working-directory: android
        run: |
          ./gradlew --no-daemon \
            :core:vault:test :core:designsystem:testDebugUnitTest :app:testProductionReleaseUnitTest \
            :app:assembleProductionRelease :app:bundleProductionRelease :app:assembleStagingRelease \
            -PversionName="${{ steps.v.outputs.name }}" -PrcNumber="${{ steps.v.outputs.rc }}" \
            -PapiBaseUrl="${{ vars.API_BASE_URL_PROD }}"
      - name: Verify signatures and the version code
        env:
          PREV: ${{ vars.ANDROID_PREV_VERSION_CODE }}
        working-directory: android/app/build/outputs
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          prod=$(ls apk/production/release/*.apk); staging=$(ls apk/staging/release/*.apk)
          "$BT/apksigner" verify --print-certs "$prod" | head -3
          "$BT/apksigner" verify --print-certs "$staging" | head -3
          code=$("$BT/aapt2" dump badging "$prod" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          echo "versionCode=$code"
          if [ -n "$PREV" ] && [ "$code" -le "$PREV" ]; then
            echo "::error::versionCode $code is not above the previous release's $PREV (ANDROID_PREV_VERSION_CODE). Android refuses downgrades."; exit 1
          fi
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
      - name: Collect release files
        run: |
          v="${{ steps.v.outputs.name }}"
          mkdir -p dist
          cp android/app/build/outputs/apk/production/release/*.apk "dist/sipwise-$v.apk"
          cp android/app/build/outputs/apk/staging/release/*.apk "dist/sipwise-staging-$v.apk"
          cp android/app/build/outputs/bundle/productionRelease/*.aab "dist/sipwise-$v.aab"
          cp android/app/build/outputs/mapping/productionRelease/mapping.txt "dist/mapping-$v.txt"
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Release notes from Conventional Commits
        run: |
          prev=$(git tag -l 'android-v*' --sort=-v:refname | grep -vx "$TAG" | head -1 || true)
          range=${prev:+$prev..}$TAG
          {
            echo "Installs over Sipwise 0.2.x and keeps you signed in (version code $VERSION_CODE)."
            echo
            for group in "feat:Features" "fix:Fixes" "perf:Performance" "refactor:Refactoring" "docs:Docs" "chore:Maintenance" "ci:CI"; do
              prefix=${group%%:*}; title=${group#*:}
              lines=$(git log "$range" --no-merges --pretty='%s' -E --grep="^$prefix(\(.+\))?!?:" || true)
              [ -n "$lines" ] && { echo "### $title"; echo "$lines" | sed 's/^/- /'; echo; }
            done
            other=$(git log "$range" --no-merges --pretty='%s' | grep -vE '^(feat|fix|perf|refactor|docs|chore|ci)(\(.+\))?!?:' || true)
            [ -n "$other" ] && { echo "### Other"; echo "$other" | sed 's/^/- /'; echo; }
          } > notes.md
          cat notes.md
      - name: Publish the pre-release
        run: |
          gh release create "$TAG" dist/* --title "Sipwise Android ${{ steps.v.outputs.name }}" --notes-file notes.md --prerelease --verify-tag
      - name: Remove signing keys
        if: always()
        run: rm -f "$RUNNER_TEMP/prod.jks" "$RUNNER_TEMP/staging.jks"
