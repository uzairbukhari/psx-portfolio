name: Deploy staging

# Every PR from this repo (and manual runs) checks, migrates, builds and deploys the
# STAGING Worker + D1 database. Production is untouched: it only deploys from main
# via deploy.yml. The quote-refresh cron Worker is never deployed to staging.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to deploy to staging (default: the selected branch)'
        required: false
        default: ''

# One shared staging: the most recently pushed PR wins.
concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  check:
    # Fork PRs get no secrets and must not reach the staging environment.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Unit tests
        run: node --test 'tests/*.test.mjs'

  deploy:
    needs: check
    runs-on: ubuntu-latest
    # CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN are `staging` environment secrets.
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      # Until the owner creates the staging D1 database and pastes its id into
      # wrangler.jsonc (env.staging), there is nothing to deploy to: skip cleanly.
      - name: Check staging database is configured
        id: configured
        run: |
          if awk '/"staging": \{/,0' wrangler.jsonc | grep -oE '"database_id": *"[0-9a-fA-F-]{36}"' | head -n 1 | grep -q '00000000-0000-0000-0000-000000000000'; then
            echo "::notice::Staging is not set up yet: env.staging.d1_databases[0].database_id in wrangler.jsonc is still the placeholder. Skipping the staging deploy (see CLAUDE.md, Staging)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - if: steps.configured.outputs.ready == 'true'
        run: npm ci
      - name: Apply staging D1 migrations
        if: steps.configured.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote --env staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The PRIVATE vault database (ciphertext only) is created on first run and its id patched into the
      # runner's copy of wrangler.jsonc. Production's vault database is never created by CI.
      - name: Ensure staging vault database
        if: steps.configured.outputs.ready == 'true'
        run: node scripts/ensure-vault-db.mjs --env staging --create
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Apply staging vault migrations
        if: steps.configured.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply VAULT_DB --remote --env staging
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Build (staging config)
        if: steps.configured.outputs.ready == 'true'
        run: npm run build
        env:
          CLOUDFLARE_ENV: staging
      - name: Deploy staging Worker
        id: deploy
        if: steps.configured.outputs.ready == 'true'
        # `shell: bash` adds pipefail, so a failed deploy isn't hidden by `tee`.
        shell: bash
        run: |
          npx wrangler deploy --config dist/server/wrangler.json 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)
          if [ -n "$url" ]; then echo "url=$url" >> "$GITHUB_OUTPUT"; fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
