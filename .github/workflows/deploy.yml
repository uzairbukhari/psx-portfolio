name: Deploy production

# Every push to main (i.e. every merged PR) checks, migrates, builds and deploys
# both Workers to the owner's Cloudflare account.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - name: Unit tests
        run: node --test 'tests/*.test.mjs'

  deploy:
    needs: check
    runs-on: ubuntu-latest
    # CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN are `prod` environment secrets.
    # Keep `prod` free of required reviewers / wait timers, or every merge will
    # stall waiting for approval. The token needs Workers Scripts:Edit and D1:Edit.
    environment: prod
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Fail closed: production must never run a build that expects the private vault database before
      # it exists and has been migrated (docs/private-portfolio-release-runbook.md). Until the owner
      # has done the cutover steps and committed the real VAULT_DB id, nothing is deployed.
      - name: Check the private vault database is configured
        id: vault
        run: |
          id=$(grep -A3 '"database_name": "psx-portfolio-sip-vault"' wrangler.jsonc | grep -oE '[0-9a-f]{8}-[0-9a-f-]{27}' | head -n 1)
          if [ -z "$id" ] || [ "$id" = "00000000-0000-0000-0000-000000000000" ]; then
            echo "::warning::Production is NOT deployed: the VAULT_DB id in wrangler.jsonc is still the placeholder. Follow docs/private-portfolio-release-runbook.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      # Migrations are append-only and idempotent, and run first so new code never
      # meets an old schema.
      - name: Apply D1 migrations
        if: steps.vault.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Apply vault D1 migrations
        if: steps.vault.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply VAULT_DB --remote
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Build
        if: steps.vault.outputs.ready == 'true'
        run: npm run build
      - name: Deploy web Worker
        if: steps.vault.outputs.ready == 'true'
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy quote-refresh Worker
        if: steps.vault.outputs.ready == 'true'
        run: npm run quote-refresh:deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
