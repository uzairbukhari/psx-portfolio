name: FX probe (temporary)
on:
  pull_request:
    paths: ['.github/workflows/fx-probe-tmp.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dry-run the scraper
        run: node scripts/fx-rates-scrape.mjs --dry-run
      - name: Show the open-market table text
        run: curl -sL -m 25 -A 'Mozilla/5.0 Chrome/126.0' https://www.forex.pk/open_market_rates.asp | sed 's/<[^>]*>/ /g' | tr -s ' \n\t' ' ' | grep -oiE '(US Dollar|UAE Dirham|U\.A\.E|Saudi Riyal).{0,80}' | head -8
