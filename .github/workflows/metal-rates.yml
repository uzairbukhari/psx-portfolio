name: Gold and silver rates

# Stores the day's gold and silver prices in the shared D1 `metal_rates` table (public data only). The dealer rate
# comes from a public page and the world price from free APIs; Cloudflare itself never fetches them.
on:
  schedule:
    # 10:00, 14:00 and 18:00 PKT, Monday to Saturday.
    - cron: '0 5,9,13 * * 1-6'
  workflow_dispatch:

concurrency:
  group: metal-rates
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: prod
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh metal_rates
        run: node scripts/metal-rates-scrape.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
