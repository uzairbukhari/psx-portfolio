name: Mobile build (Android)

# Starts ONE `eas build` for the Android APK (staging or production profile) on Expo's servers. This spends one of the free tier's
# monthly builds (15 per platform), so it only ever runs by hand and needs a typed confirmation. Use it only when
# native code changed (a new native module, app.config plugins, permissions); JavaScript-only changes ship through
# the Mobile OTA update workflow instead. The build is queued with --no-wait: this job finishes in a minute and
# prints the build link, and the APK install link appears on expo.dev (and in the build's page) when it is done.
# Needs the secret EXPO_TOKEN in the `prod` GitHub environment, like mobile-update.yml.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Which app to build (eas.json profile)'
        type: choice
        options: [production, staging]
        default: production
      confirm:
        description: 'Type "spend-one-build" to start one Android build'
        required: true

# The job only reads the repository; the Expo build uses EXPO_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

concurrency:
  group: mobile-build
  cancel-in-progress: false

jobs:
  build:
    if: inputs.confirm == 'spend-one-build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: prod
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - name: Check for the Expo token
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN is not set in the prod environment. Add it (expo.dev > Account settings > Access tokens), then run this again. No build was started."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # Shared modules in ../lib import @noble/*; give them the app's copy (the root node_modules is not installed here).
      - name: Link app dependencies for shared modules
        working-directory: .
        run: ln -s "$PWD/mobile/node_modules" node_modules
      # Never spend a build on code that does not pass the same gates as a PR.
      - run: npm run typecheck
      - run: npm test
      # eas-cli evaluates app.config.ts on this runner before queueing; production refuses to build without
      # API_BASE_URL and GOOGLE_WEB_CLIENT_ID. Pull the EAS environment's readable variables (secrets such as the
      # Firebase file stay on Expo's servers) and run the same evaluation visibly, so a problem shows its real
      # message here instead of "expo config exited with non-zero code". Neither step spends a build.
      - name: Load the EAS environment variables
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          eas_env=$([ "$PROFILE" = production ] && echo production || echo preview)
          npx eas-cli env:pull "$eas_env" --non-interactive --path .env.local
          echo "Pulled variables (names only):"; cut -d= -f1 .env.local | grep -v '^#' | grep -v '^$' || true
      - name: Check the app config
        env:
          PROFILE: ${{ inputs.profile }}
        run: EAS_BUILD=true APP_VARIANT="$PROFILE" npx expo config --json > /dev/null
      - name: Queue the Android build
        env:
          PROFILE: ${{ inputs.profile }}
        run: npx eas-cli build --profile "$PROFILE" --platform android --non-interactive --no-wait
