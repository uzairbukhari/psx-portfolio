name: Mobile app checks

# Type-checks, tests and bundles the Expo app in mobile/. It reads the shared
# modules in lib/, so changes there also run it.
on:
  pull_request:
    paths: ['mobile/**', 'lib/**', '.github/workflows/mobile-check.yml']
  workflow_dispatch:

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # Shared modules in ../lib import @noble/*; give them the same copy the app uses (the web app's root
      # node_modules is not installed in this job).
      - name: Link app dependencies for shared modules
        working-directory: .
        run: ln -s "$PWD/mobile/node_modules" node_modules
      - run: npm run typecheck
      - run: npm test
      - name: Bundle for Android and iOS
        env:
          CI: '1'
          EXPO_NO_TELEMETRY: '1'
          APP_VARIANT: staging
          API_BASE_URL: https://example.invalid
        run: npx expo export --platform android --platform ios --output-dir /tmp/expo-out
