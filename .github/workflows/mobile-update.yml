name: Mobile OTA update

# Publishes the Expo app's JavaScript to the `staging` and then the `production` channel over the air
# whenever a merge to main changes the app or the shared lib/ modules it bundles. This is `eas update`, never `eas build`: it
# uses no build from the free tier's monthly allowance. A native change (new native module, app.config
# plugins, permissions) still needs one manual `eas build`; installed apps only take updates whose
# runtimeVersion (the app version) matches.
# Needs the secret EXPO_TOKEN (an Expo access token for the `uzairbukhari` account) in the `prod` GitHub
# environment, like the other workflows' secrets. Without it the job skips cleanly. Keep `prod` free of
# required reviewers, or every merge will wait for approval.
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'lib/**', '.github/workflows/mobile-update.yml']
  workflow_dispatch:
    inputs:
      message:
        description: 'Update message (default: the commit subject)'
        required: false
        default: ''
      channel:
        description: 'Channel to publish to (merges to main publish to both staging and production)'
        type: choice
        options: [staging, production]
        default: staging

# Updates must land in merge order, and a started publish should finish rather than be cut off.
concurrency:
  group: mobile-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: prod
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - name: Check for the Expo token
        id: token
        working-directory: .
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is not set; skipping the over-the-air update."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - if: steps.token.outputs.present == 'true'
        run: npm ci
      # Shared modules in ../lib import @noble/*; give them the app's copy (the root node_modules is not installed here).
      - if: steps.token.outputs.present == 'true'
        working-directory: .
        run: ln -s "$PWD/mobile/node_modules" node_modules
      # Same gates as the PR check, so a bad merge never reaches phones.
      - if: steps.token.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.token.outputs.present == 'true'
        run: npm test
      - name: Publish over the air
        if: steps.token.outputs.present == 'true'
        env:
          MESSAGE: ${{ inputs.message || github.event.head_commit.message }}
          # A merge to main publishes to both channels (staging first); a manual run publishes to the chosen one.
          CHANNELS: ${{ inputs.channel || 'staging production' }}
        run: |
          subject="$(printf '%s' "$MESSAGE" | head -n1 | cut -c1-100)"
          for channel in $CHANNELS; do
            npm run "update:$channel" -- --non-interactive --message "${subject:-Update from main} (${GITHUB_SHA::7})"
          done
