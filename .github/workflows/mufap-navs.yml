name: MUFAP fund NAVs

# Stores the mutual fund directory and each fund's latest NAV in the shared D1 `fund_catalog` and `fund_navs` tables
# (public data only). MUFAP publishes the NAVs after the market closes; Cloudflare itself never fetches the page.
on:
  schedule:
    # 19:30 and 22:30 PKT, Monday to Saturday (prices for the day can post late).
    - cron: '30 14,17 * * 1-6'
    # A morning catch-up for a missed evening.
    - cron: '30 3 * * 1-6'
  workflow_dispatch:

concurrency:
  group: mufap-navs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: prod
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh fund_catalog and fund_navs
        run: node scripts/mufap-nav-scrape.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
