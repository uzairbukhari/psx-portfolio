name: PSX face values

# Gathers verified face-value evidence (security_face_values) from companies' own PSX disclosures and, where
# given, curated official-document entries. Runs weekly for held companies with no evidence, and on demand
# (`tickers` input) when a dividend review needs a face value. Production database only; the Worker never
# dispatches this from staging.
on:
  schedule:
    - cron: '0 13 * * 0'
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated tickers (blank = held companies with no evidence)'
        required: false
        default: ''

concurrency:
  group: psx-face-values-${{ github.event_name == 'schedule' && 'cron' || github.run_id }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    environment: prod
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # pdf.js reads the PDF disclosures; nothing else in this script needs installed packages.
      - run: npm ci --ignore-scripts
      - name: Gather face-value evidence
        # The dispatch input is untrusted text: pass it through the environment, never interpolate it.
        run: node scripts/psx-face-value-scrape.mjs ${TICKERS:+"--tickers=$TICKERS"}
        env:
          TICKERS: ${{ inputs.tickers }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Open or update a failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scraper failing: $GITHUB_WORKFLOW"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Scheduled scraper run failed: $RUN_URL"
          fi
