name: PSX payouts

# PSX drops requests from Cloudflare's network, so dividend announcements are
# scraped from a GitHub runner into the shared D1 `dividend_announcements` table.
on:
  schedule:
    # Daily 13:30 UTC Monday-Friday = 18:30 PKT, after the close, when PSX
    # companies publish most payout announcements. GitHub may delay runs.
    - cron: '30 13 * * 1-5'
    # And 13:30 PKT (08:30 UTC) Monday-Friday: boards often announce payouts around midday.
    - cron: '30 8 * * 1-5'
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated PSX symbols to fetch (default: every held company)'
        required: false
        default: ''

# Scheduled runs share one group; on-demand runs (historical dividend sync) get their own so a
# queued dispatch is never replaced by a later one.
concurrency:
  group: psx-payouts-${{ github.event_name == 'schedule' && 'cron' || github.run_id }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN are `prod` environment secrets.
    environment: prod
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh dividend_announcements from PSX
        # The symbols are validated by the script (^[A-Z0-9]{2,12}$) and passed through the
        # environment, never interpolated into the shell command.
        run: node scripts/psx-payout-scrape.mjs ${TICKERS:+"--tickers=$TICKERS"}
        env:
          TICKERS: ${{ inputs.tickers }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Open or update a failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scraper failing: $GITHUB_WORKFLOW"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Scheduled scraper run failed: $RUN_URL"
          fi
