name: PSX quotes

# PSX drops requests from Cloudflare's network, so prices are scraped from a
# GitHub runner and written straight into the shared D1 `quote_refreshes` cache.
on:
  schedule:
    # Every 5 minutes, 04:00-11:55 UTC Monday-Friday = 09:00-16:55 PKT (UTC+5),
    # covering the session and the Friday 16:30 close. GitHub may delay runs.
    - cron: '*/5 4-11 * * 1-5'
  workflow_dispatch:

concurrency:
  group: psx-quotes
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    # CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_API_TOKEN are `prod` environment secrets.
    # Keep `prod` free of required reviewers / wait timers, or every scheduled
    # run will stall waiting for approval.
    environment: prod
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Refresh quote_refreshes from PSX
        run: node scripts/psx-quote-scrape.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Open or update a failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scraper failing: $GITHUB_WORKFLOW"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Scheduled scraper run failed: $RUN_URL"
          fi
