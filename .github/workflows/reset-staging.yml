name: Reset staging DB

# Drops every table in the STAGING D1 database (including d1_migrations),
# re-applies migrations from scratch, then re-seeds. Use it to clean up after an
# abandoned PR left an extra migration on staging. Production is never touched.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "reset-staging" to confirm wiping the staging database'
        required: true
      tickers:
        description: 'Comma-separated tickers to re-seed'
        required: false
        default: 'MEBL,LUCK,OGDC,HUBC,ENGRO,SYS'

concurrency:
  group: reset-staging
  cancel-in-progress: false

jobs:
  reset:
    if: inputs.confirm == 'reset-staging'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      D1_DATABASE_ID: ${{ vars.STAGING_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require staging database id
        run: |
          if [ -z "$D1_DATABASE_ID" ]; then
            echo "::error::Set the STAGING_D1_DATABASE_ID variable in the staging environment."
            exit 1
          fi
      - name: Drop all staging tables
        run: node scripts/reset-staging.mjs
      - name: Re-apply migrations
        run: npx wrangler d1 migrations apply DB --remote --env staging

  seed:
    needs: reset
    uses: ./.github/workflows/seed-staging.yml
    with:
      tickers: ${{ inputs.tickers }}
    secrets: inherit
