name: Seed staging

# Fills the STAGING D1 database with public PSX market data for a few tickers (using
# the same scrapers as production, aimed at the staging DB) plus a small fictional
# portfolio. Never reads or writes the production database: scripts refuse to run
# the seed against the production id, and D1_DATABASE_ID is read from env.staging in
# wrangler.jsonc.
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Comma-separated tickers to scrape'
        required: false
        default: 'MEBL,LUCK,OGDC,HUBC,ENGRO,SYS'
  workflow_call:
    inputs:
      tickers:
        type: string
        required: false
        default: 'MEBL,LUCK,OGDC,HUBC,ENGRO,SYS'

concurrency:
  group: seed-staging
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TICKERS: ${{ inputs.tickers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The staging database id comes from wrangler.jsonc (env.staging), the same
      # source the deploy uses, so there is no separate GitHub variable to keep in sync.
      - name: Read staging database id
        run: |
          id=$(awk '/"staging": \{/,0' wrangler.jsonc | grep -oE '"database_id": *"[0-9a-fA-F-]{36}"' | head -n 1 | grep -oE '[0-9a-fA-F-]{36}')
          if [ -z "$id" ] || [ "$id" = "00000000-0000-0000-0000-000000000000" ]; then
            echo "::error::env.staging database_id in wrangler.jsonc is missing or still the placeholder."
            exit 1
          fi
          echo "D1_DATABASE_ID=$id" >> "$GITHUB_ENV"
      - name: Check tickers
        run: |
          if ! printf '%s' "$TICKERS" | grep -Eq '^[A-Za-z0-9]{2,12}(,[A-Za-z0-9]{2,12})*$'; then
            echo "::error::tickers must be a comma-separated list like MEBL,LUCK."
            exit 1
          fi
      - name: Seed fictional portfolio
        run: node scripts/seed-staging.mjs
      - name: Scrape quotes
        run: node scripts/psx-quote-scrape.mjs "--tickers=$TICKERS"
      - name: Scrape company facts
        run: node scripts/psx-facts-scrape.mjs "--tickers=$TICKERS"
      - name: Scrape price history
        run: node scripts/psx-history-scrape.mjs "--tickers=$TICKERS"
      - name: Scrape dividend announcements
        run: node scripts/psx-payout-scrape.mjs "--tickers=$TICKERS"
      - name: Bootstrap company directory
        # Staging cannot dispatch the production-writing directory workflow, so its directory is
        # filled here, aimed at the staging database (D1_DATABASE_ID above).
        run: node scripts/psx-directory-scrape.mjs --mode=bootstrap --limit=80
