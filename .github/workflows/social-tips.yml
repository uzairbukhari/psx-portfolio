name: Daily tips video

# Builds the daytime education short (Urdu voice-over, Sip) from scripts/social-tips-episodes.json: one episode per day,
# uploaded to the public R2 bucket with a manifest (caption + video URL) that the social posting routine reads.
# Scheduled runs stay off until the repository variable SOCIAL_TIPS_ENABLED is set to "true".
on:
  schedule:
    # 07:00 UTC = 12:00 PKT, so the video is ready for the 13:00 PKT post. GitHub may delay runs.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      episode:
        description: 'Episode id (empty = the one for today)'
        type: string
        default: ''
      dry_run:
        description: 'Slides only: no voice-over, no video, no upload'
        type: boolean
        default: true

concurrency:
  group: social-tips
  cancel-in-progress: false

jobs:
  tips:
    if: github.event_name == 'workflow_dispatch' || vars.SOCIAL_TIPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    environment: prod
    timeout-minutes: 25
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      EPISODE: ${{ github.event_name == 'workflow_dispatch' && inputs.episode || '' }}
      ELEVENLABS_VOICE_ID: 1qEiC6qsybMkmnNdVMbK
      R2_BUCKET: sipwise-social
      PUBLIC_MEDIA_URL: https://media.sipwise.trade
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Install ffmpeg (ffprobe is not on the runner)
        if: env.DRY_RUN != 'true'
        run: sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Fetch the Geist fonts
        run: npm pack geist@1.3.1 --silent && tar xzf geist-1.3.1.tgz
      - name: Render slides and video
        run: node scripts/social-tips-render.mjs ${EPISODE:+--episode=$EPISODE} --out=tips-out $([ "$DRY_RUN" = true ] && echo --no-audio)
        env:
          GEIST_DIR: package
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - name: Upload the slides for review (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: tips-slides
          path: |
            tips-out/slide-*.png
            tips-out/episode.json
      - name: Upload the video and manifest to R2
        if: env.DRY_RUN != 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          id=$(node -p "require('./tips-out/episode.json').id")
          date=$(node -p "require('./tips-out/episode.json').date")
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          key="tips/${date}/${id}.mp4"
          aws s3 cp tips-out/tip.mp4 "s3://${R2_BUCKET}/${key}" --endpoint-url "$endpoint" --content-type video/mp4
          node -e "
            const e = JSON.parse(require('fs').readFileSync('tips-out/episode.json', 'utf8'));
            require('fs').writeFileSync('manifest.json', JSON.stringify({ date: e.date, id: e.id, video: process.env.PUBLIC_MEDIA_URL + '/${key}', caption: e.caption }, null, 2));
          "
          aws s3 cp manifest.json "s3://${R2_BUCKET}/tips/${date}/manifest.json" --endpoint-url "$endpoint" --content-type application/json
          aws s3 cp manifest.json "s3://${R2_BUCKET}/tips/latest.json" --endpoint-url "$endpoint" --content-type application/json
      - name: Open or update a failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scraper failing: $GITHUB_WORKFLOW"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "Scheduled run failed: $RUN_URL"
          fi
