# versionCode = VERSION_CODE_BASE + MAJOR * 100000 + MINOR * 1000 + PATCH * 10 + slot (pre-release candidates add their number to a
# separate digit, see app/build.gradle.kts). The Expo app's EAS versionCodes are small counters, so 1.0.0 (100009) is above
# anything EAS issued. The release workflow fails if the code is not above ANDROID_PREV_VERSION_CODE (a repo variable).
VERSION_CODE_BASE=0
