plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.sipwiseargon2'
version = '0.1.0'

android {
  namespace "expo.modules.sipwiseargon2"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // Reference Argon2 (RFC 9106) from Bouncy Castle. The platform's own copy is hidden from apps, so this one is bundled.
  // Must be the jdk15to18 artifact at the version expo-updates already brings (bcutil-jdk15to18:1.81 depends on it):
  // the jdk18on artifact contains the same classes, and the release build fails on duplicate classes.
  implementation 'org.bouncycastle:bcprov-jdk15to18:1.81'
}
